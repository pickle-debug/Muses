name: Muses
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    PRODUCT_BUNDLE_IDENTIFIER: com.ordoeden.muses
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Muses/Info.plist
    CODE_SIGN_STYLE: Automatic
packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire.git
    from: 5.10.2
  RealmSwift:
    url: https://github.com/realm/realm-swift.git
    branch: community
fileGroups:
  - docs
  - README.md
targets:
  Muses:
    type: application
    platform: iOS
    sources:
      - path: Muses
        excludes:
          - Resources/provider.config.json
          - Info.plist
    resources:
      - path: Muses/Resources/provider.config.json
    dependencies:
      - package: Alamofire
      - package: RealmSwift
        product: RealmSwift
    settings:
      base:
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
